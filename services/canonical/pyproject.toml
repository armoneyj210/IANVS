[project]
name = "janus-canonical"
version = "0.1.0"
description = "Janus governed canonical promotion service"
requires-python = ">=3.14"
dependencies = [
    "janus-etl",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
janus-canonical = "janus_canonical.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.uv.sources]
janus-etl = { path = "../etl", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a running Janus PostgreSQL database",
]